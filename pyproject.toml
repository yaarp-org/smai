[tool.uv.workspace]
members = [
    "packages/smai-core",
    "packages/smai-runtime",
    "packages/smai-agents",
    "packages/smai-orchestrator",
    "packages/smai-cli",
    "packages/smai",
    "packages/smai-api-spec",
    "packages/smai-api-conformance",
    "plugins/smai-llm-bedrock",
    "plugins/smai-llm-anthropic",
    "plugins/smai-llm-openai",
    "plugins/smai-store-sqlite",
    "plugins/smai-store-postgres",
    "plugins/smai-artifacts-localfs",
    "plugins/smai-artifacts-s3",
    "plugins/smai-compute-localgpu",
    "plugins/smai-compute-modal",
    "plugins/smai-compute-runpod",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1",
    "pyyaml>=6.0",
    "hypothesis>=6.0",
    "httpx>=0.27",
    "modal>=1.4.2",
]

[tool.pytest.ini_options]
testpaths = ["packages", "plugins", "tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
markers = [
    "credentialed: requires real cloud / API credentials (AWS, Modal, Anthropic, etc.). Local-manual only — never run on CI. Each marked test ALSO carries an @pytest.mark.skipif on the relevant `*_TEST_*` env var so the test skips cleanly when creds are absent. Per Task 3.G3's no-credentials-in-CI convention.",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
