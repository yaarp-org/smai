[project]
name = "smai-orchestrator"
version = "0.1.0"
description = "Engine, pipeline-spec format, worker loop, checkpointer; SMAI PipelineSpec instances."
requires-python = ">=3.11"
dependencies = [
    "smai-core",
    "pydantic>=2.0",
    # Per Task 3.E2 — the paper-ingestion pipeline-spec's ``fetching``
    # state's on-entry handler uses the ``arxiv`` PyPI package to pull
    # LaTeX source tarballs from arxiv.org. Required at runtime because
    # the orchestrator owns the dispatch handler. Tests inject a fake
    # arxiv client through the dispatch-handler factory to keep the
    # default test path offline.
    "arxiv>=2.1",
]

[tool.uv.sources]
smai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai_orchestrator"]
