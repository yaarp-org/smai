[project]
name = "smai-orchestrator"
version = "0.1.0"
description = "Engine, pipeline-spec format, worker loop, checkpointer; SMAI PipelineSpec instances."
requires-python = ">=3.11"
dependencies = [
    "smai-core",
    "pydantic>=2.0",
]

[tool.uv.sources]
smai-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai_orchestrator"]
