# Alembic config template for the SMAI metadata schema.
#
# Loaded by ``smai_orchestrator.migrations.runner._build_config()``
# (programmatic) and by Alembic's CLI when an integrator runs
# ``alembic`` directly inside this directory. The ``script_location``
# is set programmatically to point at the package directory; this file
# only carries the static knobs.

[alembic]
# Resolved by ``runner._build_config`` to the directory containing
# this file. Empty here so a stray ``alembic --config alembic.ini``
# does not silently target the wrong tree.
script_location =

# Per Task 3.H2 / DEC-036: ``smai migrate`` always passes the URL
# explicitly via ``config.set_main_option("sqlalchemy.url", ...)``.
# The blank default is intentional — running Alembic without a URL
# raises a clear error rather than silently picking up an environment
# default.
sqlalchemy.url =

# Filename template per Alembic's standard.
file_template = %%(rev)s_%%(slug)s

# Match the SMAI v2 timezone convention (UTC for stored ``DateTime`` columns).
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
