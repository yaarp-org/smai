[project]
name = "smai-agents"
version = "0.1.0"
description = "Host-side dispatcher wrappers for sandboxed agent roles (harness builder, technique implementer). Step 8 Wave 1 (2026-05-27) split inline-role substrate into smai-inline-agents; Wave 2 relocates the remaining files into smai-orchestrator.sandboxed_dispatch and deletes this package."
requires-python = ">=3.11"
dependencies = [
    "smai-core",
    "smai-runtime",
    # The sandboxed-role host-side dispatchers (still in this package
    # between Wave 1 and Wave 2) import open_agent_session from
    # smai_inline_agents.agent_session_telemetry. Wave 2 dissolves this
    # cross-package edge by relocating the dispatchers into
    # smai_orchestrator (which already depends on smai_inline_agents).
    "smai-inline-agents",
    "pydantic>=2.0",
]

[tool.uv.sources]
smai-core = { workspace = true }
smai-runtime = { workspace = true }
smai-inline-agents = { workspace = true }
smai-llm-bedrock = { workspace = true }

[dependency-groups]
dev = [
    # Bedrock plugin powers the integration test (Task 2.B1 brief: end-to-end
    # multi-turn loop via BedrockProvider + FakeBedrockClient). It is NOT a
    # runtime dep — production users construct LlmProviders externally and
    # pass them into AgentSession.
    "smai-llm-bedrock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai_agents"]
# Step 8 Wave 1 moved the prompts/ resource tree out of this package
# into smai-inline-agents. Wave 2 deletes this package entirely; no
# force-include needed in the interim.
