[project]
name = "smai-agents"
version = "0.1.0"
description = "Custom Bedrock-Converse-style agent loop, prompt-config surface, fleet roles."
requires-python = ">=3.11"
dependencies = [
    "smai-core",
    # Task 2.B3 — the harness builder dispatch handler materializes the
    # workspace via `smai_runtime.create_workspace_skeleton` /
    # `write_template_files` / `write_contracts` (10-runtime-and-templates.md
    # §2), and the `emit_harness_manifest` tool reuses
    # `compute_harness_version_hash` / `freeze_manifest` /
    # `HarnessAPIManifest` (§5).
    "smai-runtime",
    "pydantic>=2.0",
    # YAML on disk + Pydantic in process per 04-agents.md §10.1.
    # Prompt configs ship as YAML and validate on load; pyyaml is the
    # standard Python YAML parser.
    "pyyaml>=6.0",
    # Jinja2 — the template engine 04-agents.md §10.1 commits to
    # explicitly so variants don't accidentally introduce a different
    # one. Used to render initial_user_message_template at session
    # start with task-specific variables.
    "jinja2>=3.1",
]

[tool.uv.sources]
smai-core = { workspace = true }
smai-runtime = { workspace = true }
smai-llm-bedrock = { workspace = true }

[dependency-groups]
dev = [
    # Bedrock plugin powers the integration test (Task 2.B1 brief: end-to-end
    # multi-turn loop via BedrockProvider + FakeBedrockClient). It is NOT a
    # runtime dep — production users construct LlmProviders externally and
    # pass them into AgentSession.
    "smai-llm-bedrock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai_agents"]

# Prompt-config YAML files ship as package resources so
# importlib.resources.files() can read them at load time, per
# 04-agents.md §10. Hatchling defaults include them via the package
# directive above, but force-include keeps them robust against future
# default changes (mirrors smai-runtime's templates handling).
[tool.hatch.build.targets.wheel.force-include]
"src/smai_agents/prompts" = "smai_agents/prompts"
