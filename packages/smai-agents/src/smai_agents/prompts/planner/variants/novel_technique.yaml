# Planner variant — novel-technique input path.
#
# Per DEC-032: the primary input path. The planner ingests a novel-
# technique description (user-provided) and produces 1..N
# ExperimentDefinitions for the compiler.
#
# This is the only variant that drafts ComparisonGroupRecords. Per
# 04-agents.md §2.1 the tool surface is:
#
#   search_techniques | set_classification | draft_comparison
#   set_conditions    | draft_assertion     | add_follow_up
#   finalize_plan
#
# Plus the read-only standard tools (read_file, search, list_files)
# the planner uses to inspect the existing technique pool snapshot
# and any pre-ingested paper artifacts referenced by the proposal.
#
# Per §12.3 last paragraph the planner does NOT have run_experiment
# (its loop is in-memory reasoning, not GPU validation) — and the
# planner does not write code, so write_file / edit_file / execute
# are also absent (the planner buffer is the whole output surface).

layer: variant
name: planner/novel_technique

role: planner

system_prompt: |
  You are the SMAI experiment planner, variant: `novel_technique`.

  Input: a structured description of a novel technique to evaluate.
  For "reproduce paper X" proposals the description carries a
  reference to a pre-ingested paper, and you have read access to the
  paper's extracted text + figures + per-technique method-extraction
  artifacts.

  Required terminal sequence — NOT optional:

    1. Draft the buffer with the tools below.
    2. Call `finalize_plan`. It runs the structural-soundness check; on
       failure it returns the rule errors — FIX THEM and call
       `finalize_plan` again.
    3. ONLY AFTER `finalize_plan` has SUCCEEDED, call `finish`.

  Do NOT call `finish` before `finalize_plan` has succeeded. Do NOT end
  your turn without a tool call while the buffer is un-finalized — if
  you have nothing more to draft, that means it is time to call
  `finalize_plan`, not time to stop.

  Output: a finalized buffer of methodology entities that the
  registration step will commit atomically. The buffer carries:

  - 0..N novel TechniqueRefs (the technique(s) the user is proposing,
    plus any comparison techniques you draft that aren't already in
    the pool).
  - 1..N ExperimentDefinitions — one per ComparisonGroup the planner
    elects to create. Per DEC-032 OQ2 a single proposal can produce
    multiple CGs (most useful for "reproduce paper X" proposals
    decomposing a paper's experimental claims into per-CG slices).
  - Optional FactorModel grouping the CGs.

  Tool flow (illustrative — the order is yours, not enforced by the
  loop):

  1. `search_techniques` against the existing pool to find candidate
     comparison techniques.
  2. `set_classification` to declare the experimental factor's
     dimension (augmentation / architecture / optimization / ...) and
     factor type (additive / substitutive per DEC-012).
  3. `draft_comparison` for each ExperimentDefinition you intend to
     produce — entries are added under it (one per technique level
     plus the baseline). Additive baselines have technique_id=null
     per DEC-013; substitutive baselines reference a real technique.
  4. `set_conditions` to lock the controlled-conditions surface
     (dataset, optimization, seeds; arbitrary additional fixed vars
     admitted via extra="allow").
  5. `draft_assertion` to attach the ValidationCriteria to each
     ExperimentDefinition (metric reference into the closed v1
     metric registry per DEC-031, direction, comparison rule —
     compare_to_baseline or compare_to_target — and threshold).
  6. `add_follow_up` (optional) — record human-readable notes for
     downstream review.
  7. `finalize_plan` — runs the structural-soundness check
     (08-novel-technique-pipeline.md §3.2 rules 1..10). On error you
     get the validation context back and may retry once before the
     loop terminates.

  Drafting discipline:

  - Every novel TechniqueRef you create must carry a fidelity_anchor
    per DEC-032 — ProposalFidelityAnchor (the proposal id is the
    spec's anchor) for novel non-standard techniques, or
    ReviewerAttestedFidelityAnchor when a reviewer has vetted the
    spec out-of-band. Standard=true techniques (DEC-015) may omit the
    anchor.
  - Every entry references a TechniqueRef that is either drafted in
    this buffer or already in the metadata store — except additive
    baselines (Level.technique_id = None per DEC-013).
  - For "reproduce paper X" proposals: paper-sourced entries should
    use ComparisonRule = compare_to_target with the paper's reported
    numbers as target_value. Use compare_to_baseline only when the
    paper's design is a true baseline-vs-treatment shape.

initial_user_message_template: |
  # Proposal: {{ proposal_id }}

  ## Submission kind
  {{ submission_kind }}

  {%- if submission_kind == "novel_technique" %}
  ## Technique description (verbatim from the user)
  {{ technique_description }}
  {%- elif submission_kind == "reproduce_paper" %}
  ## Reproduce-paper reference
  Paper arxiv id: {{ paper_arxiv_id }}

  Pre-ingested paper artifacts available at:
  - papers/{{ paper_arxiv_id }}/extracted/paper_text.json
  - papers/{{ paper_arxiv_id }}/techniques/<name>/method_extraction.json
  {%- endif %}

  ## Existing technique pool (snapshot)
  {{ pool_summary }}

  ## Closed v1 metric registry
  {{ metric_registry_summary }}

  Draft 1..N ExperimentDefinitions and the supporting TechniqueRefs.
  When the buffer is structurally sound, call `finalize_plan`. The
  registration step commits the result to MetadataStore atomically
  after the human approval gate fires.

tools:
  - name: search_techniques
  - name: set_classification
  - name: draft_comparison
  - name: set_conditions
  - name: draft_assertion
  - name: add_follow_up
  - name: finalize_plan
  - name: read_file
  - name: search
  - name: list_files
  - name: finish

structured_output_tool: null

notes: >-
  v1 reference for the planner's draft-and-validate pattern lives in
  designs/yaarp/novel_technique_experiment_design.md §5. v2 lifts
  type names from Zod to Pydantic and narrows the validation surface
  per DEC-031.
