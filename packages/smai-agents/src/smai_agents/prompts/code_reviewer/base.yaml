# Code reviewer — base prompt config.
#
# Per 04-agents.md §2.4 / §11. Single-call structured-output agent run
# as an edge gate on the implemented → running transition (DEC-016).
# Per §11, factor-type-aware (DEC-017).
#
# PLACEHOLDER content. The structured_output_tool's schema_module
# resolves to a Pydantic model that does not yet exist (Task 2.B4
# ships the CodeReviewResult schema); the loader resolves the import
# lazily at call time, so this base loads cleanly.

layer: base
name: code_reviewer/base

role: code_reviewer

system_prompt: |
  You are the SMAI code reviewer. Single-call discipline: invoke the
  submit_review tool with a CodeReviewResult payload covering all
  reviewable entries.

  This is a PLACEHOLDER prompt. Production content is iterated post-M2.

initial_user_message_template: |
  CG id: {{ cg_id }}
  Factor type: {{ factor_type }}
  Entries to review: {{ entry_ids }}

  Workspace artifacts are at the paths listed below. Produce a single
  CodeReviewResult covering every entry.

# Single-call agents don't expose tools beyond the synthetic
# structured-output tool. The loader emits an empty list rather than
# null so the composed config carries the explicit zero-tools shape.
tools: []

structured_output_tool:
  name: submit_review
  description: Submit the structured code-review verdict.
  schema_module: smai_agents.schemas.code_review:CodeReviewResult

notes: >-
  PLACEHOLDER. The schema_module reference (smai_agents.schemas.code_review)
  is forward-looking — Task 2.B4 ships the CodeReviewResult Pydantic
  model under that path. The loader does NOT resolve the schema at
  YAML-load time; resolution happens at structured_call dispatch.
