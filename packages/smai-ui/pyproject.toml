[project]
name = "smai-ui"
version = "0.1.0"
description = "SPA bundle wrapper for SMAI v2; ships the React UI as Python package data for FastAPI to serve at /."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# Pure data wrapper. Runtime callers (smai-api) read the bundle path
# via `from smai_ui import get_static_bundle_path`; the function uses
# only `importlib.resources` + `pathlib`, which are stdlib.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    # `hatchling` is the build backend — only PEP-517-isolated build
    # environments install it via the `[build-system].requires` list.
    # For dev-time pyright to see `hatchling.builders.hooks.plugin.interface`
    # in `build_hook.py`, we surface it here too.
    "hatchling>=1.27",
]

[build-system]
# `hatchling` provides the BuildHookInterface our in-tree
# `build_hook.py` extends. No third-party hook plugin required (per
# Approach A in Task 4.N1's brief).
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai_ui"]
# `src/smai_ui/static_spa/` is gitignored (it's a build artifact); the
# build hook stages `apps/ui/dist/*` into it before the wheel is
# packed. `artifacts` tells hatchling to include the staged files in
# the wheel even though they are not tracked in git.
artifacts = ["src/smai_ui/static_spa/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
# The in-tree custom hook. Defaults to `hatch_build.py`; we keep our
# entry-point file as `build_hook.py` for clarity, so we declare its
# path explicitly.
path = "build_hook.py"

[tool.hatch.build.targets.editable.hooks.custom]
# Editable installs (`pip install -e`, `uv sync`) also run the hook so
# the bundle is staged into `src/smai_ui/static_spa/` and importable
# via `importlib.resources` against the live source tree.
path = "build_hook.py"
