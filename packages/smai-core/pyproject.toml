[project]
name = "smai-core"
version = "0.1.0"
description = "Methodology layer: data model, DSL + compiler, contract artifacts, mechanical evaluator, plugin Protocol definitions."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
]

# Optional dep groups. Per Task 1.9 and DEC-029: the conformance test base
# classes shipped under ``smai_core.plugins.conformance`` import :mod:`pytest`
# at module load time (``@pytest.fixture`` / ``@pytest.mark.parametrize``
# decorators reference it at class-definition time). Pytest is NOT on
# smai-core's runtime allowlist (only Pydantic + jsonschema + stdlib per
# DEC-029); the ``conformance`` extra exists so plugin authors who want to
# subclass the bases can pull pytest in explicitly:
#     pip install smai-core[conformance]
# ``tools/check_deps.py`` rule 1 walks ``[project] dependencies`` only and
# ignores ``[project.optional-dependencies]``, so this group does not affect
# the dep-allowlist lint.
[project.optional-dependencies]
conformance = ["pytest>=8.0"]

# Factor-type plugin registration per 02-dsl-and-contracts.md §3.5 / DEC-026.
# vN may register additional types via this group without forking smai-core.
[project.entry-points."smai.factor_types"]
additive = "smai_core.factor_types.additive:plugin"
substitutive = "smai_core.factor_types.substitutive:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai_core"]

# The bundled metric-registry JSON (see smai_core/data/metric_registry_v1.json,
# Task 1.4) must be packaged alongside the Python sources so importlib.resources
# can locate it from a wheel install. hatchling treats files inside the listed
# `packages` as data by default, but make the include explicit so a future move
# of the JSON outside `src/smai_core/` doesn't silently drop it from the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/smai_core/data/metric_registry_v1.json" = "smai_core/data/metric_registry_v1.json"
