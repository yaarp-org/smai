<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page_title or "smai dashboard" }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="/">smai dashboard</a>
      <span class="tag">read-only</span>
    </div>
    <nav class="primary-nav">
      <a href="/proposals/">proposals</a>
      <a href="/cgs/">comparison groups</a>
      <a href="/runs/">runs</a>
      <a href="/papers/">papers</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>
      Single-user local dashboard. No authentication.
      Mutations go through the <code>smai</code> CLI verbs:
      <code>smai run</code>, <code>smai submit-proposal</code>,
      <code>smai approve-proposal</code>, <code>smai reject-proposal</code>,
      <code>smai ingest</code>.
    </p>
  </footer>
</body>
</html>
