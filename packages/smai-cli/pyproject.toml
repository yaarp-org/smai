[project]
name = "smai-cli"
version = "0.1.0"
description = "CLI verbs, config layering, RuntimeConfig, plugin instantiation."
requires-python = ">=3.11"
dependencies = [
    "smai-core",
    "smai-orchestrator",
    "smai-inline-agents",
    "smai-runtime",
    "smai-api",
    "smai-llm-bedrock",
    "smai-store-sqlite",
    "smai-artifacts-localfs",
    "smai-compute-localgpu",
    "pydantic>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]

[project.scripts]
smai = "smai_cli.main:app"

[tool.uv.sources]
smai-core = { workspace = true }
smai-orchestrator = { workspace = true }
smai-inline-agents = { workspace = true }
smai-runtime = { workspace = true }
smai-api = { workspace = true }
smai-llm-bedrock = { workspace = true }
smai-store-sqlite = { workspace = true }
smai-artifacts-localfs = { workspace = true }
smai-compute-localgpu = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai_cli"]
