[project]
name = "smai-api"
version = "0.1.0"
description = "FastAPI implementation of the SMAI v2 HTTP API contract (smai-api-spec). Per DEC-037 — one of two independent implementations of the shared contract; sibling implementation lives in the Yaarp v2 backend."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "smai-api-spec",
    "smai-cli",
    "smai-core",
    "smai-events",
    "smai-orchestrator",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Task 4.K3 / `12-ui-process.md` §6.3: dedicated asyncpg LISTEN
    # connection feeds the in-process EventBroker from cross-process
    # NOTIFY signals. We use asyncpg directly (rather than via
    # SQLAlchemy) because LISTEN requires a connection parked on the
    # channel — the SQLAlchemy pool can't satisfy that.
    "asyncpg>=0.28",
]

[project.optional-dependencies]
# `smai-api[ui]` adds the SPA bundle wrapper so `make_api_app(...)`
# mounts the React SPA at `/`. Headless API-only deployments install
# `smai-api` without the extra; `_maybe_mount_spa` detects the missing
# package and degrades gracefully. Per Task 4.N1 + `12-ui-process.md`
# §8.2 / `13-frontend.md` §12.3.
ui = [
    "smai-ui",
]

[dependency-groups]
dev = [
    "smai-api-conformance",
    "smai-store-sqlite",
    "smai-artifacts-localfs",
    # smai-ui in dev so the in-tree SPA-mount tests
    # (test_4_n1_spa_mount.py) can exercise the module-guard branch
    # without a separate install step.
    "smai-ui",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai_api"]

[tool.uv.sources]
smai-api-spec = { workspace = true }
smai-api-conformance = { workspace = true }
smai-cli = { workspace = true }
smai-core = { workspace = true }
smai-events = { workspace = true }
smai-orchestrator = { workspace = true }
smai-store-sqlite = { workspace = true }
smai-artifacts-localfs = { workspace = true }
smai-ui = { workspace = true }
