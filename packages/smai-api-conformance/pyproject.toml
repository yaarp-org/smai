[project]
name = "smai-api-conformance"
version = "0.1.0"
description = "Parameterizable pytest suite asserting API-contract conformance for any HTTP API implementing smai-api-spec. Per DEC-037."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "smai-api-spec",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai_api_conformance"]

[tool.uv.sources]
smai-api-spec = { workspace = true }
