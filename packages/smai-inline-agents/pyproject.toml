[project]
name = "smai-inline-agents"
version = "0.1.0"
description = "Inline agent roles + agent-loop infra. Hosts planner / supervisor / code_reviewer / contextual_evaluator / screener / enricher (single-call or in-process multi-turn roles). Created at Step 8 of the agent-layer refactor (2026-05-27) as part of the smai-agents deletion; the sandboxed roles (harness_builder / technique_implementer) live in smai-agent-runtime."
requires-python = ">=3.11"
dependencies = [
    "smai-core",
    # Inline roles depend on smai-runtime for the harness-manifest types,
    # the closed-v1 components mapping, the no-go-zone hash check, and
    # the workspace helpers used by run_experiment / std_tools.
    "smai-runtime",
    "pydantic>=2.0",
    # YAML on disk + Pydantic in process per 04-agents.md §10.1.
    "pyyaml>=6.0",
    # Jinja2 renders initial_user_message_template at session start.
    "jinja2>=3.1",
]

[tool.uv.sources]
smai-core = { workspace = true }
smai-runtime = { workspace = true }
smai-llm-bedrock = { workspace = true }

[dependency-groups]
dev = [
    # Bedrock plugin powers the integration test (end-to-end multi-turn
    # loop via BedrockProvider + FakeBedrockClient). NOT a runtime dep —
    # production users construct LlmProviders externally and pass them
    # into AgentSession.
    "smai-llm-bedrock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai_inline_agents"]

# Prompt-config YAML files ship as package resources so
# importlib.resources.files() can read them at load time, per
# 04-agents.md §10. Mirrors the smai-agent-runtime prompt handling.
[tool.hatch.build.targets.wheel.force-include]
"src/smai_inline_agents/prompts" = "smai_inline_agents/prompts"
