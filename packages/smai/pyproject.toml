[project]
name = "smai"
version = "0.1.0"
description = "Umbrella package re-exporting the Tier A programmatic surface."
requires-python = ">=3.11"
dependencies = [
    "smai-core",
    "smai-runtime",
    "smai-inline-agents",
    "smai-orchestrator",
    "smai-cli",
]

[project.scripts]
smai = "smai_cli.main:app"

[tool.uv.sources]
smai-core = { workspace = true }
smai-runtime = { workspace = true }
smai-inline-agents = { workspace = true }
smai-orchestrator = { workspace = true }
smai-cli = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai"]
