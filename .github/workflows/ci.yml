name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync --all-extras

      - name: Add venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pyright
        run: pyright

      - name: Dependency allowlist
        run: python tools/check_deps.py --verbose

      - name: Pytest
        run: pytest

      - name: hadolint (runtime.Dockerfile)
        # Lint the reference Dockerfiles shipped with smai-compute-localgpu
        # (Task 2.A4 deliverable). Pinned action version so a hadolint
        # upgrade cannot break CI without a deliberate bump.
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: plugins/smai-compute-localgpu/dockerfiles/runtime.Dockerfile
          recursive: false

      - name: hadolint (runtime-cpu.Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: plugins/smai-compute-localgpu/dockerfiles/runtime-cpu.Dockerfile
          recursive: false

      - name: hadolint (agent-runtime.Dockerfile)
        # Sandbox-side image for the agent-layer refactor's harness_builder
        # / technique_implementer mini-orchestrators (Step 3, D4 §6).
        # CI does not build or push the image — the operator builds
        # locally and publishes per OPERATIONS.md §7.1. This step is a
        # static lint over the Dockerfile syntax / best-practices.
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: plugins/smai-compute-localgpu/dockerfiles/agent-runtime.Dockerfile
          recursive: false
