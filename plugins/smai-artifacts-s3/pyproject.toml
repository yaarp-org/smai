[project]
name = "smai-artifacts-s3"
version = "0.1.0"
description = "ArtifactStore plugin: BYO-bucket S3 implementation."
requires-python = ">=3.11"
dependencies = []

[project.entry-points."smai.artifact_stores"]
s3 = "smai_artifacts_s3:S3Store"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai_artifacts_s3"]
