[project]
name = "smai-llm-openai"
version = "0.1.0"
description = "LlmProvider plugin: OpenAI SDK adapter."
requires-python = ">=3.11"
dependencies = []

[project.entry-points."smai.llm_providers"]
openai = "smai_llm_openai:OpenAIProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai_llm_openai"]
