[project]
name = "smai-llm-anthropic"
version = "0.1.0"
description = "LlmProvider plugin: Anthropic SDK adapter."
requires-python = ">=3.11"
dependencies = []

[project.entry-points."smai.llm_providers"]
anthropic = "smai_llm_anthropic:AnthropicProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai_llm_anthropic"]
