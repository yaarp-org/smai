# Test fixture for ``smai-store-postgres`` conformance / fair-scheduling /
# lease-contention suites. Pinned to ``postgres:17`` (latest stable as of
# 2026-04). Container exposes Postgres on host port 5433 to avoid
# collisions with a local installation. Credentials are deterministic
# and used only by tests; do not reuse for production.
#
# Usage:
#     docker compose -f compose.yaml up -d
#     SMAI_POSTGRES_TEST_URL='postgresql+asyncpg://smai:smai@localhost:5433/smai_test' \
#         uv run pytest plugins/smai-store-postgres/tests/
#     docker compose -f compose.yaml down -v

services:
  postgres:
    image: postgres:17-alpine
    container_name: smai-store-postgres-test
    environment:
      POSTGRES_USER: smai
      POSTGRES_PASSWORD: smai
      POSTGRES_DB: smai_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smai -d smai_test"]
      interval: 2s
      timeout: 5s
      retries: 10
