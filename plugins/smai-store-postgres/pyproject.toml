[project]
name = "smai-store-postgres"
version = "0.1.0"
description = "MetadataStore plugin: PostgreSQL reference production implementation."
requires-python = ">=3.11"
# Per DEC-036 / Task 3.H2 (substrate shared with the SQLite reference).
# The declarative schema + Alembic env + record↔row helpers live in
# ``smai-orchestrator.migrations`` (lifted out of ``smai-store-sqlite``
# in 3.H2). This plugin imports the same ``MetaData`` / ``Table`` set
# and swaps the driver to ``asyncpg`` so SQLAlchemy renders
# dialect-specific SQL at engine-bind time.
dependencies = [
    "smai-core",
    "smai-orchestrator",
    # Task 4.K3: PgNotifyEventChannel implements smai_events.EventChannel.
    # Sibling-package dep per `12-ui-process.md` §6 OQ1 (RESOLVED 2026-05-03).
    "smai-events",
    "sqlalchemy>=2.0",
    "asyncpg>=0.28",
    # SQLAlchemy's async layer is implemented via greenlet bridging to
    # the sync core; declared explicitly because Python 3.13 doesn't
    # pull it in transitively.
    "greenlet>=3.0",
]

[tool.uv.sources]
smai-core = { workspace = true }
smai-orchestrator = { workspace = true }
smai-events = { workspace = true }

[project.entry-points."smai.metadata_stores"]
postgres = "smai_store_postgres:PostgresStore"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smai_store_postgres"]
